security:
    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build|bundles/majpanel)/
            security: false

        majpanel:
            pattern: ^/(?:majpanel/admin|api/admin)(?:/|$)
            # MajpanelBundle adds the provider, MajpanelAuthenticator,
            # login entry point, and logout behavior to this firewall.

        # Keep the host application's catch-all firewall after majpanel.
        main:
            lazy: true

    # Only the first matching access-control rule is applied.
    access_control:
        - { path: '^/majpanel/admin/login$', roles: PUBLIC_ACCESS }
        - { path: '^/api/public(?:/|$)', roles: PUBLIC_ACCESS }
        - { path: '^/api/admin(?:/|$)', roles: ROLE_ADMIN }
        - { path: '^/api(?:/|$)', roles: ROLE_ADMIN }
        - { path: '^/majpanel/admin(?:/|$)', roles: ROLE_ADMIN }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10

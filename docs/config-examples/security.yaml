security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        app_user_provider:
            entity:
                class: Majpanel\MajpanelBundle\Entity\AdminUser
                property: username

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build|bundles/majpanel)/
            security: false
        main:
            lazy: true
            provider: app_user_provider
            form_login:
                login_path: majpanel_login
                check_path: majpanel_login
                enable_csrf: true
                default_target_path: majpanel_admin_dashboard
            logout:
                path: majpanel_logout
                target: majpanel_login
                enable_csrf: true

    # Only the first matching access-control rule is applied.
    access_control:
        - { path: '^/admin/login$', roles: PUBLIC_ACCESS }
        - { path: '^/api/public(?:/|$)', roles: PUBLIC_ACCESS }
        - { path: '^/api/admin(?:/|$)', roles: ROLE_ADMIN }
        - { path: '^/api(?:/|$)', roles: ROLE_ADMIN }
        - { path: '^/admin', roles: ROLE_ADMIN }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
